<head>

    <!-- Primary Meta Tags -->

    <!-- Twitter -->

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        //Check if the user is authenticated
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user || user.isAnonymous) {
                return;
            }

            try {
                if (await isAdminUser(user)) {
                    window.location.href = '/admin';
                } else {
                    document.getElementById('error-message').textContent = `This Google account is signed in, but is not an admin yet. Add this UID to Firestore admins: ${user.uid}`;
                }
            } catch (error) {
                console.error('Error checking admin access:', error);
            }
        });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://kit.fontawesome.com/c11e4bdbae.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="header">
    <h1>SSD Dictionary - Admin Login</h1>
</div>
<div class="container">
    <button type="button" class="googleSignInButton" onclick="signInAdminWithGoogle()">
        <svg class="googleIcon" aria-hidden="true" viewBox="0 0 18 18" focusable="false">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.12-.84 2.07-1.8 2.71v2.25h2.92c1.7-1.57 2.68-3.88 2.68-6.6z"></path>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.2l-2.92-2.25c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.32C2.44 15.98 5.49 18 9 18z"></path>
            <path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.97H.96C.35 6.18 0 7.55 0 9s.35 2.82.96 4.03l3.01-2.32z"></path>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.49 0 2.44 2.02.96 4.97l3.01 2.32C4.68 5.16 6.66 3.58 9 3.58z"></path>
        </svg>
        <span>Sign in with Google</span>
    </button>
    <div id="error-message" style="color: #a40707;"></div>
</div>

</body>
</html>
